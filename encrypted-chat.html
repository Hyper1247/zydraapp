<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CipherChat — Premium Encrypted Messaging</title>
    <meta name="description" content="End-to-end encrypted real-time chat with files, voice notes, stickers, and search-ready GIFs using Firebase and AES-256">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #06060f;
            --bg-primary: #0c0c1d;
            --bg-card: #12122a;
            --bg-input: #1a1a3e;
            --bg-hover: #22224a;
            --accent: #7c3aed;
            --accent-light: #a78bfa;
            --accent-glow: rgba(124, 58, 237, 0.25);
            --accent2: #ec4899;
            --accent2-light: #f472b6;
            --green: #10b981;
            --green-glow: rgba(16, 185, 129, 0.15);
            --red: #ef4444;
            --text: #f0f0ff;
            --text-dim: #8888aa;
            --text-muted: #555570;
            --border: rgba(124, 58, 237, 0.12);
            --border-subtle: rgba(255,255,255,0.06);
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-deep);
            color: var(--text);
        }

        /* ============ ANIMATED BACKGROUND ============ */
        .bg-animation {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .bg-animation .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            animation: orbFloat 20s ease-in-out infinite;
        }

        .bg-animation .orb:nth-child(1) {
            width: 500px; height: 500px;
            background: var(--accent);
            top: -10%; left: -5%;
            animation-duration: 25s;
        }

        .bg-animation .orb:nth-child(2) {
            width: 400px; height: 400px;
            background: var(--accent2);
            bottom: -15%; right: -10%;
            animation-duration: 30s;
            animation-delay: -5s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.05); }
        }

        /* ============ SCREENS ============ */
        .screen {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .screen.active {
            display: flex;
            animation: screenIn 0.4s ease-out;
        }

        @keyframes screenIn {
            from { opacity: 0; transform: scale(0.96) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* ============ CARDS ============ */
        .card {
            background: rgba(18, 18, 42, 0.85);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 30px 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow), 0 0 80px rgba(124,58,237,0.08);
        }

        .card-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .card-header .logo {
            font-size: 38px;
            margin-bottom: 10px;
            display: block;
        }

        .card-header h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-light), var(--accent2-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .card-header p {
            font-size: 13px;
            color: var(--text-dim);
            margin-top: 6px;
        }

        /* ============ FORM ELEMENTS ============ */
        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-dim);
            margin-bottom: 6px;
        }

        .field input,
        .field textarea {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            color: var(--text);
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.25s ease;
            outline: none;
        }

        .field input:focus,
        .field textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
            background: var(--bg-hover);
        }

        /* ============ BUTTONS ============ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #9333ea);
            color: white;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(124, 58, 237, 0.4);
        }

        .btn-secondary {
            background: var(--bg-input);
            color: var(--text);
            border: 1px solid var(--border-subtle);
        }

        .btn-secondary:hover {
            background: var(--bg-hover);
            border-color: var(--accent);
        }

        .btn-pink {
            background: linear-gradient(135deg, var(--accent2), #db2777);
            color: white;
            box-shadow: 0 4px 20px rgba(236,72,153,0.25);
        }

        .btn-pink:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(236,72,153,0.4);
        }

        /* ============ DIVIDER ============ */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-subtle);
        }

        .room-code-display {
            text-align: center;
            padding: 20px;
            background: var(--bg-input);
            border: 1px dashed var(--accent);
            border-radius: var(--radius-sm);
            margin-bottom: 18px;
        }

        .room-code-display .code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 6px;
            background: linear-gradient(135deg, var(--accent-light), var(--accent2-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .room-code-display .code-label {
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ============ INLINE ROW ============ */
        .row {
            display: flex;
            gap: 10px;
        }

        .row .field {
            flex: 1;
        }

        .row .btn {
            align-self: flex-end;
            width: auto;
            min-width: 100px;
            margin-bottom: 16px;
        }

        /* ============ CHAT SCREEN ============ */
        .chat-screen {
            flex-direction: column;
            padding: 0;
            max-width: 100%;
        }

        .chat-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: rgba(12, 12, 29, 0.7);
            backdrop-filter: blur(20px);
        }

        .chat-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(12,12,29,0.6);
        }

        .chat-header-info {
            flex: 1;
            min-width: 0;
        }

        .chat-header-info h2 {
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-header-info .sub {
            font-size: 10px;
            color: var(--text-dim);
            margin-top: 1px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
        }

        .badge-green {
            background: var(--green-glow);
            color: var(--green);
            border: 1px solid rgba(16,185,129,0.25);
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .messages-area::-webkit-scrollbar { width: 5px; }
        .messages-area::-webkit-scrollbar-track { background: transparent; }
        .messages-area::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 10px; }

        /* ============ MESSAGE BUBBLES ============ */
        .msg {
            display: flex;
            flex-direction: column;
            max-width: 78%;
            animation: msgIn 0.3s ease-out;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg.sent {
            align-self: flex-end;
            align-items: flex-end;
        }

        .msg.received {
            align-self: flex-start;
            align-items: flex-start;
        }

        .msg .sender {
            font-size: 10px;
            font-weight: 600;
            color: var(--accent-light);
            margin-bottom: 3px;
            padding: 0 4px;
        }

        .msg.sent .sender {
            color: var(--accent2-light);
        }

        .msg .bubble {
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 13.5px;
            line-height: 1.45;
            word-break: break-word;
        }

        .msg.sent .bubble {
            background: linear-gradient(135deg, var(--accent), #9333ea);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .msg.received .bubble {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }

        /* Attached image style */
        .bubble img.shared-img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 5px;
            display: block;
            cursor: zoom-in;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Stickers style */
        .bubble.sticker-bubble {
            background: none !important;
            border: none !important;
            padding: 0 !important;
        }

        .bubble img.sticker-img {
            width: 100px;
            height: 100px;
            display: block;
            animation: pulse-sticker 2s infinite ease-in-out;
        }

        @keyframes pulse-sticker {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* GIF style */
        .bubble img.gif-img {
            max-width: 100%;
            border-radius: 10px;
            display: block;
        }

        /* File attachment design */
        .file-attach {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.2);
            padding: 8px 12px;
            border-radius: 8px;
            margin-top: 5px;
            border: 1px solid var(--border-subtle);
        }

        .file-attach-icon {
            font-size: 20px;
        }

        .file-attach-info {
            flex: 1;
            min-width: 0;
        }

        .file-attach-name {
            font-size: 11.5px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-attach-size {
            font-size: 9.5px;
            color: var(--text-dim);
            margin-top: 1px;
        }

        .file-download-btn {
            background: var(--bg-hover);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 8px;
            font-size: 10.5px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }

        .file-download-btn:hover {
            background: var(--accent);
            border-color: var(--accent-light);
        }

        /* Audio message (Voice Note) Player style */
        .audio-player-bubble {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.15);
            padding: 6px 10px;
            border-radius: 12px;
            min-width: 170px;
            max-width: 240px;
            border: 1px solid var(--border-subtle);
        }

        .audio-player-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: white;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .audio-player-btn:hover {
            background: var(--accent-light);
            transform: scale(1.05);
        }

        .audio-progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255,255,255,0.15);
            border-radius: 2px;
            position: relative;
            cursor: pointer;
            min-width: 70px;
        }

        .audio-progress-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: linear-gradient(90deg, var(--accent2), var(--accent2-light));
            border-radius: 2px;
            width: 0%;
        }

        .audio-duration {
            font-size: 9.5px;
            color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
            flex-shrink: 0;
        }

        .msg .time {
            font-size: 9.5px;
            color: var(--text-muted);
            margin-top: 3px;
            padding: 0 4px;
        }

        .msg-system {
            align-self: center;
            text-align: center;
            font-size: 11.5px;
            color: var(--text-dim);
            padding: 6px 14px;
            background: rgba(124,58,237,0.08);
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        /* ============ CHAT INPUT & ATTACH PANEL ============ */
        .chat-input-area {
            padding: 10px 12px;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(12,12,29,0.9);
            position: relative;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            min-width: 0;
            transition: all 0.25s;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .input-wrapper input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text);
            padding: 10px 12px;
            font-size: 13.5px;
            outline: none;
            min-width: 0;
        }

        .input-actions-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 18px;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .input-actions-btn:hover {
            color: var(--accent-light);
            background: rgba(255,255,255,0.05);
        }

        /* Microphone record states */
        .input-actions-btn.recording {
            color: var(--red);
            animation: pulse-red 1s infinite alternate;
        }

        @keyframes pulse-red {
            from { transform: scale(1); background: rgba(239,68,68,0.1); }
            to { transform: scale(1.1); background: rgba(239,68,68,0.25); }
        }

        /* Send button circularized for mobile & elegant layout */
        .chat-input-area .send-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #9333ea);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s;
            flex-shrink: 0;
            font-size: 15px;
        }

        .chat-input-area .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        /* Voice note recording overlay bar */
        .voice-record-overlay {
            position: absolute;
            inset: 0;
            background: var(--bg-primary);
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            z-index: 5;
            border-top: 1px solid var(--border-subtle);
        }

        .voice-record-overlay.active {
            display: flex;
        }

        .voice-record-timer {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13.5px;
            font-weight: 600;
        }

        .record-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--red);
            animation: blink-dot 0.8s infinite alternate;
        }

        @keyframes blink-dot {
            from { opacity: 0.2; }
            to { opacity: 1; }
        }

        .voice-record-actions {
            display: flex;
            gap: 8px;
        }

        .record-action-btn {
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .record-action-btn.cancel {
            background: var(--bg-input);
            color: var(--text-dim);
        }

        .record-action-btn.send {
            background: linear-gradient(135deg, var(--green), #059669);
            color: white;
        }

        /* ============ PREMIUM DRAWER (EMOJIS / STICKERS / GIFS) ============ */
        .media-drawer {
            position: absolute;
            bottom: 60px;
            left: 10px;
            right: 10px;
            width: calc(100% - 20px);
            max-width: 350px;
            height: 320px;
            background: rgba(18, 18, 42, 0.95);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            backdrop-filter: blur(25px);
            display: none;
            flex-direction: column;
            z-index: 10;
            overflow: hidden;
            animation: drawerIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .media-drawer.active {
            display: flex;
        }

        @keyframes drawerIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .drawer-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-subtle);
            background: rgba(0,0,0,0.2);
        }

        .drawer-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
        }

        .drawer-tab.active {
            color: var(--accent-light);
            border-bottom-color: var(--accent);
            background: rgba(255,255,255,0.02);
        }

        .drawer-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .drawer-content::-webkit-scrollbar { width: 4px; }
        .drawer-content::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 4px; }

        /* Stickers Grid */
        .stickers-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .sticker-item {
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 8px;
            padding: 4px;
        }

        .sticker-item:hover {
            background: rgba(255,255,255,0.08);
            transform: scale(1.1);
        }

        .sticker-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* GIF Search Layout */
        .gif-search-box {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }

        .gif-search-box input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            color: var(--text);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12.5px;
            outline: none;
        }

        .gif-search-box input:focus {
            border-color: var(--accent);
        }

        .gif-search-box button {
            background: var(--accent);
            border: none;
            color: white;
            padding: 0 10px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
        }

        .gifs-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }

        .gif-item {
            cursor: pointer;
            border-radius: 6px;
            overflow: hidden;
            transition: all 0.2s;
            position: relative;
            background: rgba(255,255,255,0.02);
            height: 80px;
        }

        .gif-item:hover {
            transform: scale(1.02);
        }

        .gif-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Emojis Grid */
        .emojis-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            font-size: 20px;
        }

        .emoji-item {
            cursor: pointer;
            text-align: center;
            padding: 4px;
            border-radius: 6px;
            transition: all 0.15s;
            user-select: none;
        }

        .emoji-item:hover {
            background: rgba(255,255,255,0.1);
            transform: scale(1.2);
        }

        /* File Preview Area */
        .upload-preview-bar {
            padding: 8px 16px;
            background: rgba(124, 58, 237, 0.08);
            border-top: 1px solid var(--border);
            display: none;

    <!-- ==================== SCRIPTS ==================== -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>

    <script>
        // ==================== FIREBASE CONFIG ====================
        const defaultFirebaseConfig = {
            apiKey: "AIzaSyBKem6gUy3oiM2uzIOpjhpqwsgLoscyp-k",
            authDomain: "zydraxd-b698a.firebaseapp.com",
            databaseURL: "https://zydraxd-b698a-default-rtdb.firebaseio.com",
            projectId: "zydraxd-b698a",
            storageBucket: "zydraxd-b698a.firebasestorage.app",
            messagingSenderId: "540446787313",
            appId: "1:540446787313:web:40658b154499f84905cb50"
        };

        // Initialize Firebase
        firebase.initializeApp(defaultFirebaseConfig);
        const db = firebase.database();

        // ==================== STATE VARIABLES ====================
        let roomRef = null;
        let myName = '';
        let roomCode = '';
        let encPassword = '';
        const myId = crypto.randomUUID();
        let selectedFile = null;
        
        // Media Recorder State (Voice Notes)
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let recordInterval = null;
        let recordSeconds = 0;

        // Emojis list
        const emojis = ["😀","😃","😄","😁","😆","😅","😂","🤣","😊","😇","🙂","🙃","😉","😌","😍","🥰","😘","😗","😙","😚","😋","😛","😝","😜","🤪","🤨","🧐","🤓","😎","🤩","🥳","😏","😒","😞","😔","😟","😕","🙁","☹️","😣","😖","😫","😩","🥺","😢","😭","😤","😠","😡","🤬","🤯","😳","🥵","🥶","😱","😨","😰","😥","😓","🤗","🤔","🤭","🤫","🤥","😶","😐","😑","😬","🙄","😯","😦","😧","😮","😲","🥱","😴","🤤","😪","😵","🤐","🥴","🤢","🤮","🤧","😷","🤒","🤕","🤑","🤠","😈","👿","👹","👺","🤡","💩","👻","💀","☠️","👽","👾","🤖","🎃","😺","😸","😹","😻","😼","😽","🙀","😿","😾","👋","🤚","🖐️","✋","🖖","👌","🤏","✌️","🤞","🤟","🤘","🤙","👈","👉","👆","🖕","👇","☝️","👍","👎","✊","👊","🤛","🤜","👏","🙌","👐","🤲","🤝","🙏","✍️","💅","🤳","💪","🦾","🧠","🧡","❤️","💖","✨","🔥","🎉"];

        // Stickers list
        const stickers = [
            "https://api.dicebear.com/7.x/bottts/svg?seed=sticker1",
            "https://api.dicebear.com/7.x/bottts/svg?seed=sticker2",
            "https://api.dicebear.com/7.x/bottts/svg?seed=sticker3",
            "https://api.dicebear.com/7.x/bottts/svg?seed=sticker4",
            "https://api.dicebear.com/7.x/bottts/svg?seed=sticker5",
            "https://api.dicebear.com/7.x/bottts/svg?seed=sticker6",
            "https://api.dicebear.com/7.x/bottts/svg?seed=sticker7",
            "https://api.dicebear.com/7.x/bottts/svg?seed=sticker8",
            "https://api.dicebear.com/7.x/fun-emoji/svg?seed=sticker9",
            "https://api.dicebear.com/7.x/fun-emoji/svg?seed=sticker10",
            "https://api.dicebear.com/7.x/fun-emoji/svg?seed=sticker11",
            "https://api.dicebear.com/7.x/fun-emoji/svg?seed=sticker12",
        ];

        // ==================== SCREEN SWITCHING ====================
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // ==================== TOAST ====================
        let toastTimer = null;
        function showToast(msg, type = 'success') {
            const t = document.getElementById('statusToast');
            t.textContent = msg;
            t.className = 'status-toast ' + type + ' show';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
        }

        // ==================== ROOM LOGIC ====================
        function generateRoomCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 6; i++) {
                code += chars[Math.floor(Math.random() * chars.length)];
            }
            return code;
        }

        function validateSetup() {
            myName = document.getElementById('userName').value.trim();
            encPassword = document.getElementById('encPassword').value.trim();

            if (!myName) {
                showToast('Apna naam likho!', 'error');
                return false;
            }
            if (!encPassword) {
                showToast('Encryption password dalo!', 'error');
                return false;
            }
            return true;
        }

        function createRoom() {
            if (!validateSetup()) return;
            roomCode = generateRoomCode();
            document.getElementById('roomCodeDisplay').textContent = roomCode;
            showScreen('roomCreatedScreen');
        }

        function joinRoom() {
            if (!validateSetup()) return;
            const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
            if (!code || code.length < 4) {
                showToast('Room code empty ya galat hai!', 'error');
                return;
            }
            roomCode = code;
            startChat();
        }

        function copyRoomCode() {
            navigator.clipboard.writeText(roomCode).then(() => {
                showToast('📋 Room Code copy ho gaya: ' + roomCode);
            });
        }

        function enterChat() {
            startChat();
        }

        function leaveRoom() {
            if (roomRef) {
                roomRef.push({
                    s: '🔒 System',
                    t: encrypt(myName + ' ne chat left kar di'),
                    ts: firebase.database.ServerValue.TIMESTAMP,
                    uid: 'system',
                    type: 'system'
                });
                roomRef.off();
            }
            roomRef = null;
            document.getElementById('messagesArea').innerHTML = '';
            showScreen('setupScreen');
        }

        // ==================== ENCRYPTION ====================
        function encrypt(text) {
            return CryptoJS.AES.encrypt(text, encPassword).toString();
        }

        function decrypt(ciphertext) {
            try {
                const bytes = CryptoJS.AES.decrypt(ciphertext, encPassword);
                const result = bytes.toString(CryptoJS.enc.Utf8);
                if (!result) throw new Error('Empty');
                return result;
            } catch (e) {
                return null;
            }
        }

        // ==================== CHAT ACTIONS ====================
        function startChat() {
            document.getElementById('chatRoomTitle').textContent = 'Room: ' + roomCode;
            document.getElementById('messagesArea').innerHTML = '';
            showScreen('chatScreen');
            
            buildEmojisGrid();
            buildStickersGrid();
            searchGifs('trending');

            roomRef = db.ref('rooms/' + roomCode + '/messages');

            // Send system join alert
            roomRef.push({
                s: '🔒 System',
                t: encrypt(myName + ' chat mein join ho gaya! 🎉'),
                ts: firebase.database.ServerValue.TIMESTAMP,
                uid: 'system',
                type: 'system'
            });

            // Listen to messages
            roomRef.limitToLast(50).on('child_added', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                const decryptedText = decrypt(data.t);
                if (decryptedText === null) {
                    addSystemMessage('🔒 Ek secure message decrypt nahi ho paya (wrong password?)');
                    return;
                }

                if (data.type === 'system') {
                    addSystemMessage(decryptedText);
                } else if (data.type === 'sticker') {
                    const isMine = data.uid === myId;
                    addStickerMessage(data.s, decryptedText, isMine, data.ts);
                } else if (data.type === 'gif') {
                    const isMine = data.uid === myId;
                    addGifMessage(data.s, decryptedText, isMine, data.ts);
                } else if (data.type === 'file') {
                    const isMine = data.uid === myId;
                    const decName = decrypt(data.fileName);
                    const decData = decrypt(data.fileData);
                    addFileMessage(data.s, decName, decData, data.fileType, isMine, data.ts);
                } else if (data.type === 'voice') {
                    const isMine = data.uid === myId;
                    const decAudio = decrypt(data.audioData);
                    addVoiceMessage(data.s, decAudio, isMine, data.ts);
                } else {
                    const isMine = data.uid === myId;
                    addChatMessage(data.s, decryptedText, isMine, data.ts);
                }
            });
        }

        // Switch between microphone and send icon depending on input text length
        function handleInputText() {
            const text = document.getElementById('msgInput').value.trim();
            const recordBtn = document.getElementById('recordAudioBtn');
            const sendBtn = document.getElementById('sendTextBtn');

            if (text.length > 0 || selectedFile) {
                recordBtn.style.display = 'none';
                sendBtn.style.display = 'flex';
            } else {
                recordBtn.style.display = 'flex';
                sendBtn.style.display = 'none';
            }
        }

        function sendMessage() {
            if (selectedFile) {
                uploadSelectedFile();
                return;
            }

            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text || !roomRef) return;

            roomRef.push({
                s: myName,
                t: encrypt(text),
                ts: firebase.database.ServerValue.TIMESTAMP,
                uid: myId,
                type: 'msg'
            });

            input.value = '';
            handleInputText(); // Reset buttons display
            input.focus();
            closeMediaDrawer();
        }

        function handleChatKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        // ==================== FILE ATTACHMENTS ====================
        function triggerFileSelect() {
            document.getElementById('fileAttachInput').click();
        }

        function handleFileSelected(event) {
            const file = event.target.files[0];
            if (!file) return;

            const maxSize = 5 * 1024 * 1024;
            if (file.size > maxSize) {
                showToast('❌ Size limit 5MB hai! File bahut badi hai.', 'error');
                clearSelectedFile();
                return;
            }

            selectedFile = file;

            const sizeKB = Math.round(file.size / 1024);
            const sizeText = sizeKB > 1000 ? (sizeKB / 1024).toFixed(1) + ' MB' : sizeKB + ' KB';
            
            document.getElementById('previewFileName').textContent = file.name;
            document.getElementById('previewFileSize').textContent = `(${sizeText})`;
            document.getElementById('previewFileIcon').textContent = getFileEmoji(file.name);
            document.getElementById('uploadPreviewBar').classList.add('active');
            
            // Auto trigger send button view
            handleInputText();
        }

        function clearSelectedFile() {
            selectedFile = null;
            document.getElementById('fileAttachInput').value = '';
            document.getElementById('uploadPreviewBar').classList.remove('active');
            handleInputText();
        }

        function getFileEmoji(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            if (['png','jpg','jpeg','gif','webp'].includes(ext)) return '🖼️';
            if (['mp3','wav','ogg','aac'].includes(ext)) return '🎵';
            if (['mp4','webm','mkv','avi'].includes(ext)) return '🎥';
            if (['pdf'].includes(ext)) return '📕';
            if (['txt','doc','docx','rtf'].includes(ext)) return '📄';
            if (['zip','rar','7z'].includes(ext)) return '📦';
            return '📎';
        }

        function uploadSelectedFile() {
            if (!selectedFile || !roomRef) return;
            showToast('⏳ Encrypting aur Uploading...', 'info');

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result;

                const encData = encrypt(base64Data);
                const encName = encrypt(selectedFile.name);

                roomRef.push({
                    s: myName,
                    t: encrypt(`[Shared a file: ${selectedFile.name}]`),
                    fileName: encName,
                    fileData: encData,
                    fileType: selectedFile.type,
                    ts: firebase.database.ServerValue.TIMESTAMP,
                    uid: myId,
                    type: 'file'
                }).then(() => {
                    showToast('✅ File sent securely!');
                    clearSelectedFile();
                }).catch((err) => {
                    showToast('❌ Send fail ho gaya: ' + err.message, 'error');
                });
            };
            reader.readAsDataURL(selectedFile);
        }

        // ==================== AUDIO RECORDING (VOICE NOTES) ====================
        function toggleAudioRecording() {
            if (isRecording) {
                stopAndSendAudioRecording();
            } else {
                startAudioRecording();
            }
        }

        function startAudioRecording() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showToast('❌ Mic access is browser me supported nahi hai.', 'error');
                return;
            }

            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    audioChunks = [];
                    mediaRecorder = new MediaRecorder(stream);
                    
                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    
                    document.getElementById('voiceRecordOverlay').classList.add('active');
                    document.getElementById('recordAudioBtn').classList.add('recording');
                    
                    recordSeconds = 0;
                    document.getElementById('recordTimer').textContent = '00:00';
                    clearInterval(recordInterval);
                    recordInterval = setInterval(() => {
                        recordSeconds++;
                        const mins = Math.floor(recordSeconds / 60).toString().padStart(2, '0');
                        const secs = (recordSeconds % 60).toString().padStart(2, '0');
                        document.getElementById('recordTimer').textContent = `${mins}:${secs}`;
                    }, 1000);

                    showToast('🎙️ Recording started...');
                })
                .catch(err => {
                    showToast('❌ Mic permission denied!', 'error');
                });
        }

        function stopAndSendAudioRecording() {
            if (!mediaRecorder || !isRecording) return;
            showToast('⏳ Sending Voice Note...', 'info');

            clearInterval(recordInterval);
            
            mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Audio = e.target.result;
                    const encAudio = encrypt(base64Audio);

                    roomRef.push({
                        s: myName,
                        t: encrypt('[Shared a Voice Note]'),
                        audioData: encAudio,
                        ts: firebase.database.ServerValue.TIMESTAMP,
                        uid: myId,
                        type: 'voice'
                    }).then(() => {
                        showToast('✅ Voice Note sent securely!');
                    });
                };
                reader.readAsDataURL(audioBlob);
                
                isRecording = false;
                document.getElementById('voiceRecordOverlay').classList.remove('active');
                document.getElementById('recordAudioBtn').classList.remove('recording');
            };

            mediaRecorder.stop();
        }

        function cancelAudioRecording() {
            if (!mediaRecorder || !isRecording) return;
            
            clearInterval(recordInterval);
            mediaRecorder.onstop = () => {
                isRecording = false;
                document.getElementById('voiceRecordOverlay').classList.remove('active');
                document.getElementById('recordAudioBtn').classList.remove('recording');
                showToast('❌ Recording Cancelled', 'error');
            };
            mediaRecorder.stop();
        }

        // ==================== PLAY VOICE NOTE ====================
        function toggleAudioPlay(btn, base64Data) {
            let audio = btn.audioObj;
            const fill = btn.parentElement.querySelector('.audio-progress-fill');
            const timeDisplay = btn.parentElement.querySelector('.audio-duration');

            if (!audio) {
                audio = new Audio(base64Data);
                btn.audioObj = audio;

                audio.addEventListener('timeupdate', () => {
                    const pct = (audio.currentTime / audio.duration) * 100;
                    fill.style.width = pct + '%';
                    
                    const min = Math.floor(audio.currentTime / 60).toString().padStart(2, '0');
                    const sec = Math.floor(audio.currentTime % 60).toString().padStart(2, '0');
                    timeDisplay.textContent = `${min}:${sec}`;
                });

                audio.addEventListener('ended', () => {
                    btn.textContent = '▶️';
                    fill.style.width = '0%';
                    timeDisplay.textContent = '00:00';
                });
            }

            if (audio.paused) {
                audio.play();
                btn.textContent = '⏸️';
            } else {
                audio.pause();
                btn.textContent = '▶️';
            }
        }

        // ==================== MEDIA DRAWER LOGIC ====================
        function toggleMediaDrawer() {
            const drawer = document.getElementById('mediaDrawer');
            drawer.classList.toggle('active');
        }

        function closeMediaDrawer() {
            document.getElementById('mediaDrawer').classList.remove('active');
        }

        function switchDrawerTab(tabId) {
            document.querySelectorAll('.drawer-tab').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.drawer-content').forEach(c => c.style.display = 'none');
            
            event.target.classList.add('active');
            document.getElementById('drawerTab-' + tabId).style.display = 'block';
        }

        function buildEmojisGrid() {
            const grid = document.getElementById('emojisGrid');
            grid.innerHTML = '';
            emojis.forEach(emoji => {
                const span = document.createElement('div');
                span.className = 'emoji-item';
                span.textContent = emoji;
                span.onclick = () => {
                    document.getElementById('msgInput').value += emoji;
                    handleInputText();
                    document.getElementById('msgInput').focus();
                };
                grid.appendChild(span);
            });
        }

        function buildStickersGrid() {
            const grid = document.getElementById('stickersGrid');
            grid.innerHTML = '';
            stickers.forEach(url => {
                const item = document.createElement('div');
                item.className = 'sticker-item';
                item.innerHTML = `<img src="${url}" alt="sticker">`;
                item.onclick = () => {
                    sendSticker(url);
                };
                grid.appendChild(item);
            });
        }

        function sendSticker(url) {
            if (!roomRef) return;
            roomRef.push({
                s: myName,
                t: encrypt(url),
                ts: firebase.database.ServerValue.TIMESTAMP,
                uid: myId,
                type: 'sticker'
            });
            closeMediaDrawer();
        }

        function handleGifSearchKey(e) {
            if (e.key === 'Enter') {
                searchGifs();
            }
        }

        function searchGifs(query = '') {
            const gifsGrid = document.getElementById('gifsGrid');
            if (!query) {
                query = document.getElementById('gifSearchInput').value.trim();
            }
            if (!query) return;

            gifsGrid.innerHTML = '<div style="grid-column: 1/3; text-align:center; padding: 20px; font-size:12px; color:var(--text-dim);">⏳ Loading...</div>';

            const apiKey = 'dc6zaTOxFJmzC';
            const endpoint = query === 'trending' 
                ? `https://api.giphy.com/v1/gifs/trending?api_key=${apiKey}&limit=20`
                : `https://api.giphy.com/v1/gifs/search?api_key=${apiKey}&q=${encodeURIComponent(query)}&limit=20`;

            fetch(endpoint)
                .then(res => res.json())
                .then(data => {
                    gifsGrid.innerHTML = '';
                    if (!data.data || data.data.length === 0) {
                        gifsGrid.innerHTML = '<div style="grid-column:1/3; text-align:center; padding:20px; font-size:12px; color:var(--text-dim);">❌ No GIFs</div>';
                        return;
                    }
                    data.data.forEach(item => {
                        const gifUrl = item.images.fixed_height.url;
                        const card = document.createElement('div');
                        card.className = 'gif-item';
                        card.innerHTML = `<img src="${gifUrl}" alt="gif">`;
                        card.onclick = () => sendGif(gifUrl);
                        gifsGrid.appendChild(card);
                    });
                })
                .catch(() => {
                    gifsGrid.innerHTML = '<div style="grid-column:1/3; text-align:center; padding:20px; font-size:12px; color:var(--red);">Failed</div>';
                });
        }

        // Send dynamic GIF
        function sendGif(url) {
            if (!roomRef) return;
            roomRef.push({
                s: myName,
                t: encrypt(url),
                ts: firebase.database.ServerValue.TIMESTAMP,
                uid: myId,
                type: 'gif'
            });
            closeMediaDrawer();
        }

        // ==================== RENDER MESSAGES ====================
        function addChatMessage(sender, text, isMine, timestamp) {
            const area = document.getElementById('messagesArea');
            const div = document.createElement('div');
            div.className = 'msg ' + (isMine ? 'sent' : 'received');

            const time = timestamp ? new Date(timestamp).toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit'
            }) : '';

            div.innerHTML = `
                <div class="sender">${escapeHtml(sender)}</div>
                <div class="bubble">${escapeHtml(text)}</div>
                <div class="time">${time}</div>
            `;

            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }

        function addStickerMessage(sender, url, isMine, timestamp) {
            const area = document.getElementById('messagesArea');
            const div = document.createElement('div');
            div.className = 'msg ' + (isMine ? 'sent' : 'received');

            const time = timestamp ? new Date(timestamp).toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit'
            }) : '';

            div.innerHTML = `
                <div class="sender">${escapeHtml(sender)}</div>
                <div class="bubble sticker-bubble">
                    <img src="${url}" class="sticker-img" alt="Sticker">
                </div>
                <div class="time">${time}</div>
            `;

            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }

        function addGifMessage(sender, url, isMine, timestamp) {
            const area = document.getElementById('messagesArea');
            const div = document.createElement('div');
            div.className = 'msg ' + (isMine ? 'sent' : 'received');

            const time = timestamp ? new Date(timestamp).toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit'
            }) : '';

            div.innerHTML = `
                <div class="sender">${escapeHtml(sender)}</div>
                <div class="bubble">
                    <img src="${url}" class="gif-img" alt="GIF" onclick="zoomImage(this)">
                </div>
                <div class="time">${time}</div>
            `;

            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }

        function addFileMessage(sender, fileName, fileData, fileType, isMine, timestamp) {
            const area = document.getElementById('messagesArea');
            const div = document.createElement('div');
            div.className = 'msg ' + (isMine ? 'sent' : 'received');

            const time = timestamp ? new Date(timestamp).toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit'
            }) : '';

            const isImg = fileType && fileType.startsWith('image/');
            let bubbleHtml = '';

            if (isImg) {
                bubbleHtml = `
                    <div class="sender">${escapeHtml(sender)}</div>
                    <div class="bubble">
                        <div style="font-size:12px; font-weight:600; color:rgba(255,255,255,0.7); margin-bottom:5px;">🖼️ ${escapeHtml(fileName)}</div>
                        <img src="${fileData}" class="shared-img" onclick="zoomImage(this)" alt="Shared Photo">
                        <div style="margin-top: 8px;">
                            <a href="${fileData}" download="${fileName}" class="file-download-btn">💾 Save</a>
                        </div>
                    </div>
                    <div class="time">${time}</div>
                `;
            } else {
                bubbleHtml = `
                    <div class="sender">${escapeHtml(sender)}</div>
                    <div class="bubble">
                        <div class="file-attach">
                            <div class="file-attach-icon">${getFileEmoji(fileName)}</div>
                            <div class="file-attach-info">
                                <div class="file-attach-name">${escapeHtml(fileName)}</div>
                                <div class="file-attach-size">${fileType ? fileType : 'Unknown Type'}</div>
                            </div>
                            <a href="${fileData}" download="${fileName}" class="file-download-btn">💾 Download</a>
                        </div>
                    </div>
                    <div class="time">${time}</div>
                `;
            }

            div.innerHTML = bubbleHtml;
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }

        function addVoiceMessage(sender, audioBase64, isMine, timestamp) {
            const area = document.getElementById('messagesArea');
            const div = document.createElement('div');
            div.className = 'msg ' + (isMine ? 'sent' : 'received');

            const time = timestamp ? new Date(timestamp).toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit'
            }) : '';

            const msgEl = document.createElement('div');
            msgEl.innerHTML = `<div class="sender">${escapeHtml(sender)}</div>`;
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            const player = document.createElement('div');
            player.className = 'audio-player-bubble';
            
            const playBtn = document.createElement('button');
            playBtn.className = 'audio-player-btn';
            playBtn.textContent = '▶️';
            playBtn.onclick = () => toggleAudioPlay(playBtn, audioBase64);
            
            const progress = document.createElement('div');
            progress.className = 'audio-progress-bar';
            
            const progressFill = document.createElement('div');
            progressFill.className = 'audio-progress-fill';
            
            const duration = document.createElement('span');
            duration.className = 'audio-duration';
            duration.textContent = '00:00';
            
            progress.appendChild(progressFill);
            player.appendChild(playBtn);
            player.appendChild(progress);
            player.appendChild(duration);
            bubble.appendChild(player);
            msgEl.appendChild(bubble);
            
            const timeEl = document.createElement('div');
            timeEl.className = 'time';
            timeEl.textContent = time;
            msgEl.appendChild(timeEl);

            div.appendChild(msgEl);
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }

        function addSystemMessage(text) {
            const area = document.getElementById('messagesArea');
            const div = document.createElement('div');
            div.className = 'msg-system';
            div.textContent = text;
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ==================== IMAGE MODAL ZOOM ====================
        function zoomImage(imgEl) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            modalImg.src = imgEl.src;
            modal.style.display = 'flex';
        }

        function closeImageModal() {
            document.getElementById('imageModal').style.display = 'none';
        }
    </script>
</body>
